gear_type: 'tricycle'
n_struts_mlg: 2 # Number of main landing gear struts
n_wheels_mlg: 2 # Number of main landing gear wheels
n_wheels_nlg: 1 # Number of nose(tail) landing gear wheels
pt: 30       # Tire pressure [PSI]. Value for landing on hard grass/sand from Vos
n_nlg_min_as: 0.08 # Minimum nose(tail) landing gear load fraction. Value from Vos
n_nlg_max_as: 0.15 # Maximum nose(tail) landing gear load fraction. Value from Vos
tipover: 15     # Tip-over angle requirement [degrees]. Value from Vos
scrape: 15      # Scrape angle requirement  [degrees]. Not applicable for taildragger. Value from Roskam
prop_clear: 0.18 # propeller clearance requirement with nose wheel [m]. From CS25.925
fus_pitch: 0          # Fuselage inclination relative to ground plane [degrees]
turnover: 50          # Turnover angle requirement [degrees]. Value from Roskam for rough field
bank: 8               # Bank angle clearance requirement [degrees]. Valye from Vos
a: 0.33333               # Fraction of total stroke between 1-g compression and full compression. Value from Vos
s: 0.3               # Total stroke of the suspension system [m]
fus_ground_clear: null # Required for taildragger

selected_mlg_tire: null
selected_nlg_tire: null

